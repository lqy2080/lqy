<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的第一个 GitHub 项目 · 待办清单</title>
<style>
:root{font-family:system-ui,sans-serif;color:#19332e;background:#eef4ef}
*{box-sizing:border-box}
body{margin:0;padding:60px 20px}
main{max-width:640px;margin:auto;background:white;padding:32px;border-radius:24px;box-shadow:0 16px 60px #16392b12}
.tag{font-size:13px;letter-spacing:2px;color:#417568}
h1{font-size:32px;margin:14px 0}
p{line-height:1.7;color:#5b6e66}
form{display:flex;gap:10px;margin:28px 0 20px}
input[type=text]{flex:1;min-width:0;padding:14px;border:1px solid #a6bdb1;border-radius:10px;font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:#216b52;color:white}
button:hover{background:#164c3a}
button:focus-visible,input:focus-visible{outline:3px solid #d59b2d;outline-offset:3px}
ul{padding:0;list-style:none}
li{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #e6eee8}
li span{flex:1;overflow-wrap:anywhere}
li.done span{text-decoration:line-through;color:#7d8b83}
input[type=checkbox]{width:20px;height:20px;accent-color:#216b52}
.delete{background:#f3e9e7;color:#933c32;font-size:14px;padding:8px 12px}
.delete:hover{background:#e9d4cf}
footer{margin-top:28px;border-top:1px solid #e6eee8;padding-top:16px;font-size:13px;color:#61766a}
#message{font-size:14px;color:#9b4230}
@media(max-width:420px){main{padding:22px}body{padding:24px 12px}h1{font-size:26px}}
</style>
<script src="app.js" defer></script>
</head>
<body>
<main>
<div class="tag">HELLO, GITHUB</div>
<!-- 第一个练习：把下面的标题改成你喜欢的名字 -->
<h1>我的待办清单</h1>
<p>从一件小事开始。写下任务，完成后打个勾。</p>
<form id="task-form">
<label for="task-input" hidden>新任务</label>
<input id="task-input" type="text" maxlength="120" placeholder="例如：学会在 GitHub 修改文件" required autocomplete="off">
<button type="submit">添加</button>
</form>
<p id="message" role="status" hidden></p>
<p id="summary" aria-live="polite"></p>
<ul id="task-list" aria-label="待办任务"></ul>
<p id="empty">清单还是空的，添加你的第一个任务吧。</p>
<footer>任务保存在当前浏览器中。换设备或清除浏览器数据后不会保留。</footer>
</main>
</body>
</html>
